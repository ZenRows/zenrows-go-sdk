# Release automation is bound to this file name. Do not rename it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify on the Go proxy again, for example service/api/v1.2.1
        required: true
        type: string

permissions: {}

jobs:
  release-pr:
    name: Open or update the release PR
    # After the tag job: on the push that merges a release PR, release-please
    # must see the new release, or it reads the whole history as unreleased.
    needs: release
    if: ${{ !cancelled() && github.event_name == 'push' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-pr
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # A PR that GITHUB_TOKEN opens starts no workflows, so start CI on each
      # open release PR here. Its results show on the release PR.
      - name: Run CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions \
            --label "autorelease: pending" --json headRefName --jq '.[].headRefName' |
            while read -r branch; do
              echo "Starting CI on $branch"
              gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            done

  detect:
    name: Detect a release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.detect.outputs.release }}
      component: ${{ steps.detect.outputs.component }}
      module: ${{ steps.detect.outputs.module }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      previous_tag: ${{ steps.detect.outputs.previous_tag }}
      ref: ${{ steps.detect.outputs.ref }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          manifest=.release-please-manifest.json
          no_release() { echo "release=false" >>"$GITHUB_OUTPUT"; echo "No release: $1"; exit 0; }
          # $1: component (a module path such as service/api), $2: version
          release() {
            {
              echo "release=true"
              echo "component=$1"
              echo "module=$(awk '$1 == "module" { print $2; exit }' "$1/go.mod")"
              echo "version=$2"
              echo "tag=$1/v$2"
            } >>"$GITHUB_OUTPUT"
          }

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! [[ "$INPUT_TAG" =~ ^(service/[a-z]+)/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::The tag must look like service/api/v1.2.3."; exit 1
            fi
            component=${BASH_REMATCH[1]} version=${BASH_REMATCH[2]}
            jq -e --arg c "$component" 'has($c)' "$manifest" >/dev/null || {
              echo "::error::$component is not a released module."; exit 1; }
            git rev-parse -q --verify "refs/tags/$INPUT_TAG" >/dev/null || {
              echo "::error::The tag $INPUT_TAG does not exist."; exit 1; }
            # Only a tag this workflow released: its commit is on main and it
            # has a GitHub release. A hand-made tag on an unreviewed commit is refused.
            [ "$GITHUB_REF" = refs/heads/main ] || {
              echo "::error::Run the Release workflow from main."; exit 1; }
            git merge-base --is-ancestor "refs/tags/$INPUT_TAG" HEAD || {
              echo "::error::The tag $INPUT_TAG is not on main."; exit 1; }
            gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || {
              echo "::error::The tag $INPUT_TAG has no GitHub release."; exit 1; }
            release "$component" "$version"
            {
              echo "ref=refs/tags/$INPUT_TAG"
              echo "sha=$(git rev-list -n 1 "refs/tags/$INPUT_TAG")"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # This push must merge a release PR that release-please opened and
          # change the manifest. Branch name alone is not enough: anyone with
          # write access can name a branch. "tagged" keeps a full re-run working.
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
            [.[] | select(.merged_at != null
                          and (.head.ref | startswith("release-please--branches--main"))
                          and .user.login == "github-actions[bot]"
                          and ([.labels[].name] | any(. == "autorelease: pending" or . == "autorelease: tagged")))][0]
            | select(. != null) | "\(.number) \(.head.ref)"')
          [ -n "$head" ] || no_release "this push does not merge a release PR"
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$manifest"; then no_release "the manifest did not change"; fi

          # Each module has its own release PR, so the manifest changes for one module only.
          changed=$(jq -r --argjson old "$(git show "$BEFORE:$manifest")" \
            '[to_entries[] | select(.value != $old[.key]) | .key] | select(length == 1) | .[0]' "$manifest")
          [ -n "$changed" ] || { echo "::error::The manifest must change for exactly one module."; exit 1; }
          [ "${head#* }" = "release-please--branches--main--components--$changed" ] || {
            echo "::error::The release PR branch ${head#* } does not release $changed."; exit 1; }

          version=$(jq -r --arg c "$changed" '.[$c]' "$manifest")
          previous=$(git show "$BEFORE:$manifest" | jq -r --arg c "$changed" '.[$c]')
          echo "Release PR #${head%% *}: $changed v$previous -> v$version"
          release "$changed" "$version"
          {
            echo "previous_tag=$changed/v$previous"
            echo "ref=$GITHUB_SHA"
            echo "sha=$GITHUB_SHA"
          } >>"$GITHUB_OUTPUT"

  # Checks run with read-only rights. The job that can create the tag runs no
  # project code.
  build:
    name: Check and build
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ needs.detect.outputs.component }}
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ needs.detect.outputs.component }}/go.mod
          cache: false

      - name: Run the checks
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...

      - name: Build
        run: |
          set -euo pipefail
          go build ./...
          # A module with a version constant must carry the release version.
          if [ -f version/version.go ]; then
            grep -qF "const Version = \"$VERSION\"" version/version.go
          fi

  release:
    name: Tag, release and publish
    needs: [detect, build]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      COMPONENT: ${{ needs.detect.outputs.component }}
      MODULE: ${{ needs.detect.outputs.module }}
      VERSION: ${{ needs.detect.outputs.version }}
      TAG: ${{ needs.detect.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.detect.outputs.previous_tag }}
      COMMIT: ${{ needs.detect.outputs.sha }}
      IS_PUSH: ${{ github.event_name == 'push' }}
    steps:
      # A re-run after a partial release finds its own tag and goes on to publish.
      - name: Check the tag
        id: tag
        if: env.IS_PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null) || exit 0
          sha=$(jq -r .object.sha <<<"$ref")
          if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          fi
          if [ "$sha" != "$COMMIT" ]; then
            echo "::error::The tag $TAG already exists on another commit ($sha)."
            exit 1
          fi
          echo "::notice::The tag $TAG already exists on this commit. Creating it is skipped."
          echo "exists=true" >>"$GITHUB_OUTPUT"

      - name: Create the tag and GitHub release
        if: env.IS_PUSH == 'true' && steps.tag.outputs.exists != 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Set the release title and notes
        if: env.IS_PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$TAG" -f "previous_tag_name=$PREVIOUS_TAG" --jq .body |
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$COMPONENT v$VERSION" --notes-file -

      # Go has no upload: the first request for the version makes the Go
      # proxy fetch the tag, and later requests read its copy.
      - name: Publish and verify on the Go proxy
        env:
          GOPROXY: https://proxy.golang.org
          GOTOOLCHAIN: local
        run: |
          for _ in $(seq 10); do
            go list -m "$MODULE@v$VERSION" && exit 0
            sleep 15
          done
          echo "::error::$MODULE v$VERSION is not on the Go proxy after 150 seconds."
          exit 1

      - name: Write the summary
        run: |
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "## $COMPONENT v$VERSION"
            echo "- Tag: [$TAG]($repo/tree/$TAG)"
            echo "- Release: [$TAG]($repo/releases/tag/$TAG)"
            echo "- Go: [$MODULE@v$VERSION](https://pkg.go.dev/$MODULE@v$VERSION)"
            echo "- Commit: [${COMMIT:0:7}]($repo/commit/$COMMIT)"
          } >>"$GITHUB_STEP_SUMMARY"
